    timeout: 15000

- waitForAnimationToEnd

- takeScreenshot: /Users/aabyzovext/Projects/AI bussines ideas/AnticryBabyApp/BabyInCarApp/fastlane/screenshots/en-US/APP_IPAD_13_01_home

- tapOn:
