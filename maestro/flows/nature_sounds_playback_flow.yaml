# Maestro E2E Test: Nature Sounds Playback Flow
# Tests nature sounds audio playback with R2 streaming
#
# Run: maestro test maestro/flows/nature_sounds_playback_flow.yaml
#
# Prerequisites:
# - App installed on simulator
# - Network connectivity for R2 streaming

appId: com.babyincar.app
---
- launchApp

# Wait for home screen to load
- extendedWaitUntil:
    visible:
      text: ".*[Hh]ome.*|.*[Pp]lay.*|.*[Ll]ibrary.*"
    timeout: 5000

- takeScreenshot: "nature_01_home"

# Navigate to Library
- runFlow:
    when:
      visible: "Library"
    commands:
      - tapOn: "Library"

# Wait for library to load
- extendedWaitUntil:
    visible:
      text: ".*[Cc]ategories.*|.*[Nn]ature.*|.*[Ss]ounds.*"
    timeout: 5000
    optional: true

- takeScreenshot: "nature_02_library"

# Find and tap on Nature Sounds category
- runFlow:
    when:
      visible: "Nature Sounds"
    commands:
      - tapOn: "Nature Sounds"

- runFlow:
    when:
      visible: "Nature"
    commands:
      - tapOn: "Nature"

# Wait for nature sounds tracks to load from API
- extendedWaitUntil:
    visible:
      text: ".*[Oo]cean.*|.*[Rr]ain.*|.*[Ww]ind.*|.*[Bb]irds.*|.*[Ss]tream.*|.*[Ff]orest.*"
    timeout: 8000

- takeScreenshot: "nature_03_tracks_list"

# Verify we have tracks loaded (checking for common nature sound titles)
- assertVisible:
    text: ".*[Oo]cean.*[Ww]aves.*|.*[Gg]entle.*[Rr]ain.*|.*[Bb]abbling.*[Ss]tream.*"
    optional: true

# Select first nature sound track
- tapOn:
    text: ".*[Oo]cean.*"
    index: 0
    optional: true

- runFlow:
    when:
      notVisible: ".*[Pp]layer.*"
    commands:
      - tapOn:
          text: ".*[Rr]ain.*"
          index: 0
          optional: true

# Wait for player view or playback to start
- extendedWaitUntil:
    visible:
      id: "playButton|pauseButton|playerView"
    timeout: 5000
    optional: true

- takeScreenshot: "nature_04_player_opened"

# Verify audio is playing or can be played
- runFlow:
    when:
      visible:
        id: "pauseButton"
    commands:
      - assertVisible:
          id: "pauseButton"
      - takeScreenshot: "nature_05_audio_playing"

- runFlow:
    when:
      visible:
        id: "playButton"
    commands:
      - tapOn:
          id: "playButton"
      - extendedWaitUntil:
          visible:
            id: "pauseButton"
          timeout: 5000
          optional: true
      - takeScreenshot: "nature_05_audio_started"

# Wait a few seconds to verify audio continues playing
- waitForAnimationToEnd

# Check that progress indicator shows time (verifies duration is correct)
- assertVisible:
    text: ".*[0-9]+:[0-9]+.*"
    optional: true

- takeScreenshot: "nature_06_progress_indicator"

# Test pause functionality
- runFlow:
    when:
      visible:
        id: "pauseButton"
    commands:
      - tapOn:
          id: "pauseButton"
      - extendedWaitUntil:
          visible:
            id: "playButton"
          timeout: 3000
          optional: true

- takeScreenshot: "nature_07_paused"

# Resume playback
- runFlow:
    when:
      visible:
        id: "playButton"
    commands:
      - tapOn:
          id: "playButton"

- takeScreenshot: "nature_08_resumed"

# Try next track button if available
- runFlow:
    when:
      visible:
        id: "nextButton|skipForward"
    commands:
      - tapOn:
          id: "nextButton|skipForward"
      - takeScreenshot: "nature_09_next_track"

# Navigate back to verify state persistence
- runFlow:
    when:
      visible:
        id: "backButton"
    commands:
      - tapOn:
          id: "backButton"

- takeScreenshot: "nature_10_final"

# Verify we're back at library/home
- assertVisible:
    text: ".*[Ll]ibrary.*|.*[Hh]ome.*|.*[Nn]ature.*"
    optional: true
