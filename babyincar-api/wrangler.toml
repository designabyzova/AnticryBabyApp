name = "babyincar-api"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# Workers AI binding for Llama 3.1 and other models
[ai]
binding = "AI"

# Development settings
[vars]
ENVIRONMENT = "development"
APP_NAME = "Baby in Car API"
# Secrets (set via wrangler secret put <NAME>):
# - GEMINI_API_KEY: Gemini 2.0 Flash free tier key (https://aistudio.google.com/apikey)
# - SUNO_API_KEY: Get from https://sunoapi.org/
# - AIML_API_KEY: Get from https://aimlapi.com/

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "babyincar-db"
database_id = "ef5e8555-8f3e-4d14-a2d9-6c369fea7e6d"

# KV Namespace for sessions and cache
[[kv_namespaces]]
binding = "SESSIONS"
id = "8836dde7b33a4f3680050f8120c547e7"

[[kv_namespaces]]
binding = "CACHE"
id = "f04a98bd5e034cac9ae923076e048275"

# R2 Bucket for audio files and images
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "anticrybaby"

[[r2_buckets]]
binding = "PODCAST_BUCKET"
bucket_name = "anticrybaby"

# Images bucket - disabled until created
# [[r2_buckets]]
# binding = "IMAGES_BUCKET"
# bucket_name = "babyincar-images"

# Rate limiting
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1"
# simple = { limit = 100, period = 60 }

# Scheduled triggers for automated audio curation
# Runs daily at 9:00 UTC (Gemini free tier = no AI cost concerns)
[triggers]
crons = ["0 9 * * *"]

# Production environment
[env.production]
vars = { ENVIRONMENT = "production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "babyincar-db-prod"
database_id = "YOUR_PROD_D1_DATABASE_ID"

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "YOUR_PROD_KV_NAMESPACE_ID"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "YOUR_PROD_CACHE_KV_ID"

[[env.production.r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "babyincar-audio-prod"

[[env.production.r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "babyincar-images-prod"

# Custom domain
routes = [
  { pattern = "api.babyincar.app", custom_domain = true }
]
