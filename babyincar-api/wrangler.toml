name = "babyincar-api"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# Workers AI binding for Llama 3.1 and other models
[ai]
binding = "AI"

# Development settings
[vars]
ENVIRONMENT = "development"
APP_NAME = "Baby in Car API"
# Note: Set these secrets via: wrangler secret put SUNO_API_KEY
# Available music generation API keys (configure one):
# - SUNO_API_KEY: Get from https://sunoapi.org/
# - AIML_API_KEY: Get from https://aimlapi.com/

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "babyincar-db"
database_id = "YOUR_D1_DATABASE_ID"  # Replace after running: wrangler d1 create babyincar-db

# KV Namespace for sessions and cache
[[kv_namespaces]]
binding = "SESSIONS"
id = "YOUR_KV_NAMESPACE_ID"  # Replace after running: wrangler kv:namespace create sessions

[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_CACHE_KV_ID"  # Replace after running: wrangler kv:namespace create cache

# R2 Bucket for audio files and images
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "anticrybaby"

[[r2_buckets]]
binding = "PODCAST_BUCKET"
bucket_name = "anticrybaby"

[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "babyincar-images"

# Rate limiting
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1"
# simple = { limit = 100, period = 60 }

# Scheduled triggers for automated audio curation
# - Daily at 3 AM UTC: Full curation run
# - Every 6 hours: Quick discovery check
[triggers]
crons = ["0 3 * * *", "0 */6 * * *"]

# Production environment
[env.production]
vars = { ENVIRONMENT = "production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "babyincar-db-prod"
database_id = "YOUR_PROD_D1_DATABASE_ID"

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "YOUR_PROD_KV_NAMESPACE_ID"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "YOUR_PROD_CACHE_KV_ID"

[[env.production.r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "babyincar-audio-prod"

[[env.production.r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "babyincar-images-prod"

# Custom domain (configure after deployment)
# routes = [
#   { pattern = "api.babyincar.app", custom_domain = true }
# ]
