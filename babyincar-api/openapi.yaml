components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BabyId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Baby profile ID
    TrackId:
      name: trackId
      in: path
      required: true
      schema:
        type: string
      description: Track ID
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 100
      description: Results per page
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
      description: Pagination offset

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PremiumRequired:
      description: Premium subscription required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AdminRequired:
      description: Admin access required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    # Auth schemas
    RegisterRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Required for email auth
        name:
          type: string
        auth_provider:
          type: string
          enum: [email, apple]
          default: email
        apple_id_token:
          type: string
          description: Required for Apple Sign-In

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT token (1 hour expiry)
        refresh_token:
          type: string
          description: Refresh token (30 days expiry)

    TokenRefreshResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
        refresh_token:
          type: string

    # User schemas
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        auth_provider:
          type: string
          enum: [email, apple]
        subscription_status:
          type: string
          enum: [free, premium, family]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8

    UserSettings:
      type: object
      properties:
        notifications_enabled:
          type: boolean
          default: true
        auto_play_carplay:
          type: boolean
          default: true
        max_volume_db:
          type: integer
          minimum: 30
          maximum: 70
          default: 50
        default_sleep_timer_minutes:
          type: integer
          minimum: 5
          maximum: 120
          default: 30
        preferred_languages:
          type: array
          items:
            type: string
        theme:
          type: string
          enum: [light, dark, auto]
          default: auto

    Favorite:
      type: object
      properties:
        id:
          type: string
        track_id:
          type: string
        playlist_id:
          type: string
        track:
          $ref: '#/components/schemas/Track'
        playlist:
          $ref: '#/components/schemas/Playlist'
        created_at:
          type: string
          format: date-time

    # Baby schemas
    Baby:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        birth_date:
          type: string
          format: date
        photo_url:
          type: string
        age_months:
          type: integer
          description: Calculated age in months
        developmental_stage:
          $ref: '#/components/schemas/DevelopmentalStage'
        preferences:
          $ref: '#/components/schemas/BabyPreferences'
        created_at:
          type: string
          format: date-time

    CreateBabyRequest:
      type: object
      required:
        - name
        - birth_date
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        birth_date:
          type: string
          format: date
        photo_data:
          type: string
          description: Base64 encoded photo

    UpdateBabyRequest:
      type: object
      properties:
        name:
          type: string
        birth_date:
          type: string
          format: date
        photo_data:
          type: string

    BabyPreferencesRequest:
      type: object
      properties:
        effective_track_id:
          type: string
        calming_time_seconds:
          type: integer
        favorite_category:
          $ref: '#/components/schemas/AudioCategory'
        preferred_language:
          type: string

    BabyPreferences:
      type: object
      properties:
        favorite_category:
          $ref: '#/components/schemas/AudioCategory'
        preferred_language:
          type: string
        most_effective_tracks:
          type: array
          items:
            type: string
        average_calming_time:
          type: integer

    DevelopmentalStage:
      type: string
      enum:
        - fourth_trimester
        - early_regulation
        - sensory_exploration
        - motor_development
        - vocabulary_burst
        - sentence_building
        - imagination_growth

    # Content schemas
    AudioCategory:
      type: string
      enum:
        - white_noise
        - nature_sounds
        - classical_music
        - fairy_tales
        - instrumental
        - children_songs
        - podcasts
        - lullabies
        - ambient

    Track:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        category:
          $ref: '#/components/schemas/AudioCategory'
        duration_seconds:
          type: integer
        audio_source_type:
          type: string
          enum: [generated, recorded]
        stream_url:
          type: string
        thumbnail_url:
          type: string
        is_premium:
          type: boolean
        calming_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        language:
          type: string
        age_min_months:
          type: integer
        age_max_months:
          type: integer
        created_at:
          type: string
          format: date-time

    Playlist:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/AudioCategory'
        thumbnail_url:
          type: string
        track_count:
          type: integer
        total_duration:
          type: integer
        is_premium:
          type: boolean

    PlaylistWithTracks:
      allOf:
        - $ref: '#/components/schemas/Playlist'
        - type: object
          properties:
            tracks:
              type: array
              items:
                $ref: '#/components/schemas/Track'

    RecommendationsResponse:
      type: object
      properties:
        success:
          type: boolean
        baby:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            age_months:
              type: integer
            developmental_stage:
              $ref: '#/components/schemas/DevelopmentalStage'
        recommended_tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
        emergency_tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
        recommended_playlists:
          type: array
          items:
            $ref: '#/components/schemas/Playlist'
        personalization_score:
          type: number
          format: float

    BabyMood:
      type: string
      enum:
        - sleepy
        - crying
        - playful
        - calm
        - fussy

    # Analytics schemas
    PlaybackEvent:
      type: object
      required:
        - track_id
        - event_type
        - position_seconds
        - session_id
      properties:
        baby_id:
          type: string
        track_id:
          type: string
        event_type:
          type: string
          enum: [play, pause, complete, skip]
        position_seconds:
          type: integer
        session_id:
          type: string
        context:
          type: string
          enum: [home, carplay, emergency]

    EffectivenessEvent:
      type: object
      required:
        - baby_id
        - track_id
        - was_effective
      properties:
        baby_id:
          type: string
        track_id:
          type: string
        was_effective:
          type: boolean
        calming_time_seconds:
          type: integer
        context:
          type: string
          enum: [crying, fussy, sleepy]
        emergency_mode:
          type: boolean

    EmergencySession:
      type: object
      required:
        - baby_id
        - started_at
      properties:
        baby_id:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        phases_completed:
          type: array
          items:
            type: string
        was_successful:
          type: boolean
        tracks_used:
          type: array
          items:
            type: string

    EmergencySessionUpdate:
      type: object
      properties:
        ended_at:
          type: string
          format: date-time
        phases_completed:
          type: array
          items:
            type: string
        was_successful:
          type: boolean
        tracks_used:
          type: array
          items:
            type: string

    AnalyticsInsights:
      type: object
      properties:
        success:
          type: boolean
        insights:
          type: object
          properties:
            total_listening_time_minutes:
              type: integer
            most_effective_category:
              $ref: '#/components/schemas/AudioCategory'
            most_effective_tracks:
              type: array
              items:
                type: object
                properties:
                  track_id:
                    type: string
                  success_rate:
                    type: number
            average_calming_time_seconds:
              type: integer
            emergency_mode_usage:
              type: object
              properties:
                total_activations:
                  type: integer
                success_rate:
                  type: number

    # AI schemas
    AiRecommendRequest:
      type: object
      required:
        - baby_id
      properties:
        baby_id:
          type: string
        mood:
          $ref: '#/components/schemas/BabyMood'
        trip_duration_minutes:
          type: integer
        time_of_day:
          type: string
          enum: [morning, afternoon, evening, night]
        context:
          type: string

    AiRecommendResponse:
      type: object
      properties:
        success:
          type: boolean
        baby:
          type: object
          properties:
            name:
              type: string
            age_months:
              type: integer
            stage:
              $ref: '#/components/schemas/DevelopmentalStage'
        ai_recommendation:
          type: object
          properties:
            primary_recommendation:
              type: object
              properties:
                category:
                  $ref: '#/components/schemas/AudioCategory'
                reasoning:
                  type: string
                suggested_tracks:
                  type: array
                  items:
                    type: string
                expected_effectiveness:
                  type: number
            alternative_recommendations:
              type: array
              items:
                type: object
            calming_strategy:
              type: object
              properties:
                approach:
                  type: string
                phases:
                  type: array
                  items:
                    type: string
                estimated_calming_time_minutes:
                  type: integer
            tips_for_parent:
              type: array
              items:
                type: string
            warning_signs:
              type: array
              items:
                type: string
        recommended_tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
        model_used:
          type: string
          example: "@cf/meta/llama-3.1-8b-instruct"

    EmergencyAdviceRequest:
      type: object
      required:
        - baby_id
      properties:
        baby_id:
          type: string
        crying_duration_minutes:
          type: integer
        intensity:
          type: string
          enum: [mild, moderate, severe]
        tried_sounds:
          type: array
          items:
            type: string

    EmergencyAdviceResponse:
      type: object
      properties:
        success:
          type: boolean
        emergency_advice:
          type: object
          properties:
            immediate_action:
              type: string
            sound_sequence:
              type: array
              items:
                type: object
                properties:
                  sound:
                    type: string
                  duration_seconds:
                    type: integer
                  volume:
                    type: number
            calming_technique:
              type: string
            safety_reminder:
              type: string
            when_to_stop:
              type: string
            expected_result:
              type: string
        recommended_generator:
          type: string

    EffectivenessAnalysis:
      type: object
      properties:
        success:
          type: boolean
        baby:
          type: object
          properties:
            name:
              type: string
            age_months:
              type: integer
            stage:
              $ref: '#/components/schemas/DevelopmentalStage'
        analysis:
          type: object
          properties:
            patterns_identified:
              type: array
              items:
                type: string
            most_effective_characteristics:
              type: object
              properties:
                categories:
                  type: array
                  items:
                    $ref: '#/components/schemas/AudioCategory'
                tempo_range:
                  type: string
                best_contexts:
                  type: array
                  items:
                    type: string
            insights:
              type: string
            recommendations:
              type: array
              items:
                type: string
            developmental_note:
              type: string
        data_points_analyzed:
          type: integer

    GenerateStoryRequest:
      type: object
      required:
        - baby_id
      properties:
        baby_id:
          type: string
        theme:
          type: string
          default: gentle adventure
        include_name:
          type: boolean
          default: true
        length:
          type: string
          enum: [short, medium, long]
          default: medium

    GeneratedStory:
      type: object
      properties:
        success:
          type: boolean
        story:
          type: object
          properties:
            text:
              type: string
            theme:
              type: string
            length:
              type: string
            personalized:
              type: boolean
            estimated_duration_seconds:
              type: integer

    # Subscription schemas
    VerifyReceiptRequest:
      type: object
      required:
        - receipt_data
        - product_id
      properties:
        receipt_data:
          type: string
          description: Base64 encoded App Store receipt
        product_id:
          type: string
          example: com.babyincar.premium.monthly

    SubscriptionVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
        valid:
          type: boolean
        subscription:
          type: object
          properties:
            product_id:
              type: string
            expires_at:
              type: string
              format: date-time
            is_trial:
              type: boolean
            will_renew:
              type: boolean
        entitlements:
          type: array
          items:
            type: string
            enum:
              - premium_content
              - offline_downloads
              - all_languages
              - unlimited_emergency
              - carplay
              - advanced_ai
              - family_sharing
              - multiple_profiles

    SubscriptionStatus:
      type: object
      properties:
        success:
          type: boolean
        subscription:
          type: object
          properties:
            status:
              type: string
              enum: [free, premium, family]
            is_active:
              type: boolean
            expires_at:
              type: string
              format: date-time
              nullable: true
            entitlements:
              type: array
              items:
                type: string

    # Audio stats schema
    AudioStats:
      type: object
      properties:
        success:
          type: boolean
        stats:
          type: object
          properties:
            totals:
              type: object
              properties:
                total_tracks:
                  type: integer
                total_duration:
                  type: integer
                premium_tracks:
                  type: integer
                free_tracks:
                  type: integer
            by_category:
              type: array
              items:
                type: object
                properties:
                  category:
                    $ref: '#/components/schemas/AudioCategory'
                  count:
                    type: integer
                  duration:
                    type: integer
            by_source_type:
              type: array
              items:
                type: object
                properties:
                  source_type:
                    type: string
                  count:
                    type: integer

    # Curation schemas
    CurationStats:
      type: object
      properties:
        success:
          type: boolean
        library:
          type: object
          properties:
            totals:
              type: object
              properties:
                total_tracks:
                  type: integer
                total_duration:
                  type: integer
                sources_count:
                  type: integer
                categories_count:
                  type: integer
                total_size_mb:
                  type: number
                total_hours:
                  type: number
                premium_tracks:
                  type: integer
                free_tracks:
                  type: integer
            by_category_and_source:
              type: array
              items:
                type: object
            recent_additions:
              type: array
              items:
                $ref: '#/components/schemas/Track'
        available_categories:
          type: array
          items:
            $ref: '#/components/schemas/AudioCategory'

    AudioSource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        enabled:
          type: boolean
        track_count:
          type: integer

    QualityReport:
      type: object
      properties:
        success:
          type: boolean
        report:
          type: object
          properties:
            score_distribution:
              type: array
              items:
                type: object
                properties:
                  range:
                    type: string
                  count:
                    type: integer
            top_tracks:
              type: array
              items:
                $ref: '#/components/schemas/Track'
            needs_review:
              type: array
              items:
                $ref: '#/components/schemas/Track'
            category_health:
              type: array
              items:
                type: object
                properties:
                  category:
                    $ref: '#/components/schemas/AudioCategory'
                  average_score:
                    type: number
                  track_count:
                    type: integer
            generated_at:
              type: string
              format: date-time

    # Music Generation schemas
    MusicPreset:
      type: object
      properties:
        id:
          type: string
          example: "lullaby_gentle_piano"
        name:
          type: string
          example: "Gentle Piano Lullaby"
        category:
          $ref: '#/components/schemas/AudioCategory'
        instrumental:
          type: boolean
        language:
          type: string
          example: "instrumental"
        targetAge:
          type: object
          properties:
            min:
              type: integer
            max:
              type: integer

    MusicPresetFull:
      allOf:
        - $ref: '#/components/schemas/MusicPreset'
        - type: object
          properties:
            prompt:
              type: string
              description: The AI prompt used for generation
            style:
              type: string
              description: Music style tags

    MusicGenerationRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          description: Text description of the music to generate
          example: "A gentle, soothing piano lullaby for babies"
        lyrics:
          type: string
          description: Custom lyrics (optional)
        style:
          type: string
          description: Music style/genre tags
          example: "lullaby, piano, soft, gentle"
        title:
          type: string
          description: Title for the generated track
        instrumental:
          type: boolean
          default: true
          description: Whether to generate instrumental only
        duration:
          type: integer
          minimum: 30
          maximum: 240
          description: Target duration in seconds
        model:
          type: string
          enum: [v4, v4.5, v5]
          default: v4.5
          description: Suno AI model version

    MusicGenerationResponse:
      type: object
      properties:
        success:
          type: boolean
        taskId:
          type: string
          description: Task ID for status polling
        status:
          type: string
          enum: [pending, processing, completed, failed]
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedTrack'
        credits:
          type: object
          properties:
            used:
              type: integer
            remaining:
              type: integer

    GeneratedTrack:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        audioUrl:
          type: string
          format: uri
        imageUrl:
          type: string
          format: uri
        duration:
          type: number
        lyrics:
          type: string
        style:
          type: string
        createdAt:
          type: string
          format: date-time

    MusicTaskStatus:
      type: object
      properties:
        success:
          type: boolean
        taskId:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedTrack'
        error:
          type: string
