openapi: 3.0.3
info:
  title: Baby in Car API
  description: |
    API for the AnticryBaby/Baby in Car application - a calming audio platform for babies.

    ## Features
    - Audio content library with streaming
    - AI-powered personalized recommendations (Llama 3.1)
    - Baby profile management with developmental stage tracking
    - Analytics and effectiveness tracking
    - Premium subscriptions via App Store
    - CarPlay support

    ## Authentication
    Most endpoints require JWT authentication. Include the token in the Authorization header:
    ```
    Authorization: Bearer {token}
    ```

    ## Rate Limiting
    - Default: 100 requests/minute per user
    - Rate limit headers included in responses
  version: 1.0.0
  contact:
    name: AnticryBaby Support
    email: support@babyincar.app
  license:
    name: Proprietary

servers:
  - url: https://api.babyincar.app
    description: Production server
  - url: http://localhost:8787
    description: Local development server

tags:
  - name: Health
    description: Health check endpoints
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User profile and settings management
  - name: Babies
    description: Baby profile management
  - name: Content
    description: Audio content catalog and recommendations
  - name: Audio
    description: Audio streaming and file management
  - name: Music Generation
    description: AI-powered music generation using Suno API
  - name: Analytics
    description: Playback and effectiveness analytics
  - name: AI
    description: AI-powered recommendations and advice
  - name: Subscriptions
    description: Premium subscription management
  - name: Curation
    description: Audio library curation (admin)

paths:
  /:
    get:
      tags:
        - Health
      summary: API info and health check
      operationId: getApiInfo
      responses:
        '200':
          description: API status
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Baby in Car API
                  version:
                    type: string
                    example: 1.0.0
                  status:
                    type: string
                    example: healthy
                  environment:
                    type: string
                    enum: [development, production]
                  timestamp:
                    type: string
                    format: date-time

  /health:
    get:
      tags:
        - Health
      summary: Simple health status
      operationId: getHealth
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  # ============ AUTHENTICATION ============
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login with email and password
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/apple:
    post:
      tags:
        - Authentication
      summary: Sign in with Apple
      operationId: appleSignIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_token
              properties:
                id_token:
                  type: string
                  description: Apple ID token
                authorization_code:
                  type: string
                  description: Apple authorization code (optional)
      responses:
        '200':
          description: Apple Sign-In successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh JWT token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    delete:
      tags:
        - Authentication
      summary: Logout and invalidate session
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                all_devices:
                  type: boolean
                  description: Logout from all devices
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============ USERS ============
  /users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Users
      summary: Update user profile
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Users
      summary: Delete user account
      operationId: deleteCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirm_email
              properties:
                confirm_email:
                  type: string
                  description: Must match user email to confirm deletion
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/me/settings:
    get:
      tags:
        - Users
      summary: Get user settings
      operationId: getUserSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  settings:
                    $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Users
      summary: Update user settings
      operationId: updateUserSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  settings:
                    $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/favorites:
    get:
      tags:
        - Users
      summary: Get user favorites
      operationId: getUserFavorites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User favorites
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  favorites:
                    type: array
                    items:
                      $ref: '#/components/schemas/Favorite'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Users
      summary: Add to favorites
      operationId: addFavorite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                track_id:
                  type: string
                playlist_id:
                  type: string
      responses:
        '200':
          description: Added to favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Users
      summary: Remove from favorites
      operationId: removeFavorite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                track_id:
                  type: string
                playlist_id:
                  type: string
      responses:
        '200':
          description: Removed from favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============ BABIES ============
  /babies:
    get:
      tags:
        - Babies
      summary: Get all baby profiles
      operationId: getBabies
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of baby profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  babies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Baby'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Babies
      summary: Create baby profile
      operationId: createBaby
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBabyRequest'
      responses:
        '201':
          description: Baby profile created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  baby:
                    $ref: '#/components/schemas/Baby'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /babies/{id}:
    get:
      tags:
        - Babies
      summary: Get baby profile
      operationId: getBaby
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BabyId'
      responses:
        '200':
          description: Baby profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  baby:
                    $ref: '#/components/schemas/Baby'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Babies
      summary: Update baby profile
      operationId: updateBaby
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BabyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBabyRequest'
      responses:
        '200':
          description: Baby profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  baby:
                    $ref: '#/components/schemas/Baby'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Babies
      summary: Delete baby profile
      operationId: deleteBaby
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BabyId'
      responses:
        '200':
          description: Baby profile deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /babies/{id}/preferences:
    post:
      tags:
        - Babies
      summary: Update baby preferences
      operationId: updateBabyPreferences
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BabyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BabyPreferencesRequest'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  preferences:
                    $ref: '#/components/schemas/BabyPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============ CONTENT ============
  /content/tracks:
    get:
      tags:
        - Content
      summary: Get all tracks
      operationId: getTracks
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/AudioCategory'
        - name: language
          in: query
          schema:
            type: string
        - name: age_min
          in: query
          schema:
            type: integer
            minimum: 0
          description: Minimum age in months
        - name: age_max
          in: query
          schema:
            type: integer
            maximum: 36
          description: Maximum age in months
        - name: search
          in: query
          schema:
            type: string
          description: Search in title/artist
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of tracks
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tracks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Track'
                  total:
                    type: integer
                  has_more:
                    type: boolean

  /content/tracks/{id}:
    get:
      tags:
        - Content
      summary: Get track details
      operationId: getTrack
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TrackId'
      responses:
        '200':
          description: Track details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  track:
                    $ref: '#/components/schemas/Track'
        '404':
          $ref: '#/components/responses/NotFound'

  /content/playlists:
    get:
      tags:
        - Content
      summary: Get all playlists
      operationId: getPlaylists
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/AudioCategory'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of playlists
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  playlists:
                    type: array
                    items:
                      $ref: '#/components/schemas/Playlist'
                  total:
                    type: integer
                  has_more:
                    type: boolean

  /content/playlists/{id}:
    get:
      tags:
        - Content
      summary: Get playlist with tracks
      operationId: getPlaylist
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Playlist with tracks
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  playlist:
                    $ref: '#/components/schemas/PlaylistWithTracks'
        '404':
          $ref: '#/components/responses/NotFound'

  /content/recommendations:
    get:
      tags:
        - Content
      summary: Get personalized recommendations
      operationId: getRecommendations
      security:
        - bearerAuth: []
      parameters:
        - name: baby_id
          in: query
          required: true
          schema:
            type: string
        - name: mood
          in: query
          schema:
            $ref: '#/components/schemas/BabyMood'
        - name: trip_duration
          in: query
          schema:
            type: string
            enum: [quick, medium, long, road_trip]
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 30
      responses:
        '200':
          description: Personalized recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /content/stream/{track_id}:
    get:
      tags:
        - Content
      summary: Get streaming URL for track
      operationId: getStreamUrl
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TrackId'
      responses:
        '200':
          description: Streaming URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  audio_source_type:
                    type: string
                    enum: [generated, recorded]
                  stream_url:
                    type: string
                    description: Signed URL (for recorded) or generator type (for generated)
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PremiumRequired'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============ AUDIO ============
  /audio/stream/{trackId}:
    get:
      tags:
        - Audio
      summary: Stream audio file
      operationId: streamAudio
      parameters:
        - $ref: '#/components/parameters/TrackId'
        - name: Range
          in: header
          schema:
            type: string
          description: Range header for partial content
      responses:
        '200':
          description: Full audio file
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '206':
          description: Partial audio content
          headers:
            Content-Range:
              schema:
                type: string
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/PremiumRequired'
        '404':
          $ref: '#/components/responses/NotFound'

  /audio/file/{key}:
    get:
      tags:
        - Audio
      summary: Direct file access from R2
      operationId: getAudioFile
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: R2 file key
      responses:
        '200':
          description: Audio file
          content:
            audio/*:
              schema:
                type: string
                format: binary
        '206':
          description: Partial audio content
          content:
            audio/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /audio/upload:
    post:
      tags:
        - Audio
      summary: Upload audio file (admin only)
      operationId: uploadAudio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - category
                - title
              properties:
                file:
                  type: string
                  format: binary
                category:
                  $ref: '#/components/schemas/AudioCategory'
                title:
                  type: string
                artist:
                  type: string
      responses:
        '201':
          description: Audio uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  track_id:
                    type: string
                  r2_key:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /audio/{trackId}:
    delete:
      tags:
        - Audio
      summary: Delete audio track (admin only)
      operationId: deleteAudio
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TrackId'
      responses:
        '200':
          description: Track deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'

  /audio/list:
    get:
      tags:
        - Audio
      summary: List R2 files (admin only)
      operationId: listAudioFiles
      security:
        - bearerAuth: []
      parameters:
        - name: prefix
          in: query
          schema:
            type: string
            default: audio/
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of files
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        size:
                          type: integer
                        uploaded:
                          type: string
                          format: date-time
                  cursor:
                    type: string
        '403':
          $ref: '#/components/responses/AdminRequired'

  /audio/stats:
    get:
      tags:
        - Audio
      summary: Get audio library statistics
      operationId: getAudioStats
      responses:
        '200':
          description: Library statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioStats'

  # ============ ANALYTICS ============
  /analytics/playback:
    post:
      tags:
        - Analytics
      summary: Record playback event
      operationId: recordPlayback
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackEvent'
      responses:
        '201':
          description: Event recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  event_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/effectiveness:
    post:
      tags:
        - Analytics
      summary: Record track effectiveness
      operationId: recordEffectiveness
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EffectivenessEvent'
      responses:
        '201':
          description: Effectiveness recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  record_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/emergency:
    post:
      tags:
        - Analytics
      summary: Record emergency session start
      operationId: recordEmergencySession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencySession'
      responses:
        '201':
          description: Session recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  session_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
