name: Hourly Audio Scraper

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run scraper
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          python babyincar-api/scripts/no-api-key-scraper.py

      - name: Trigger Cloudflare Worker curation
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          # Call the curation endpoint to process scraped content
          curl -X POST "https://babyincar-api.anton-abyzov.workers.dev/curation/run" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            --fail-with-body || echo "Curation endpoint not available"

      - name: Upload scraped metadata
        uses: actions/upload-artifact@v4
        with:
          name: scraped-tracks-${{ github.run_number }}
          path: BabyInCarApp/BabyInCarApp/Resources/Audio/scraped_tracks.json
          retention-days: 7

      - name: Commit new tracks (if any)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Check if there are changes
          if [[ -n $(git status --porcelain BabyInCarApp/BabyInCarApp/Resources/Audio/) ]]; then
            git add BabyInCarApp/BabyInCarApp/Resources/Audio/
            git commit -m "chore: Auto-scraped new audio tracks [skip ci]"
            git push
            echo "New tracks committed!"
          else
            echo "No new tracks to commit"
          fi
