<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#F3DDF3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="faceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:0.6" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="512" cy="512" r="450" fill="url(#bgGradient)"/>

  <!-- Glow effect -->
  <circle cx="512" cy="512" r="220" fill="url(#glowGradient)" opacity="0.6"/>

  <!-- Main face circle -->
  <circle cx="512" cy="512" r="180" fill="url(#faceGradient)"/>
  <circle cx="512" cy="512" r="180" fill="none" stroke="#6366F1" stroke-width="2" opacity="0.3"/>

  <!-- Inner face background -->
  <circle cx="512" cy="512" r="145" fill="#F3DDF3" opacity="0.9"/>

  <!-- Left eye (closed) -->
  <path d="M 462 490 Q 472 480 482 490" stroke="#6366F1" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Right eye (closed) -->
  <path d="M 542 490 Q 552 480 562 490" stroke="#6366F1" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Left cheek -->
  <circle cx="470" cy="520" r="18" fill="#FCA5A5" opacity="0.5"/>

  <!-- Right cheek -->
  <circle cx="554" cy="520" r="18" fill="#FCA5A5" opacity="0.5"/>

  <!-- Smile -->
  <path d="M 482 540 Q 512 555 542 540" stroke="#6366F1" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Music note 1 (top-right) -->
  <g transform="translate(600, 380) rotate(-15)">
    <circle cx="0" cy="20" r="12" fill="#6366F1" opacity="0.6"/>
    <rect x="-3" y="-20" width="6" height="40" fill="#6366F1" opacity="0.6" rx="3"/>
    <circle cx="0" cy="-20" r="8" fill="none" stroke="#6366F1" stroke-width="4" opacity="0.6"/>
  </g>

  <!-- Music note 2 (left) -->
  <g transform="translate(380, 480) rotate(10)">
    <circle cx="0" cy="18" r="10" fill="#6366F1" opacity="0.5"/>
    <rect x="-2.5" y="-15" width="5" height="33" fill="#6366F1" opacity="0.5" rx="2.5"/>
  </g>

  <!-- Music note 3 (bottom-right) -->
  <g transform="translate(620, 600) rotate(-10)">
    <circle cx="0" cy="16" r="9" fill="#6366F1" opacity="0.5"/>
    <rect x="-2" y="-12" width="4" height="28" fill="#6366F1" opacity="0.5" rx="2"/>
  </g>
</svg>
